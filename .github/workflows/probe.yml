name: API 진단 (임시)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 접속 진단
        env:
          TOUR_RAW: ${{ secrets.TOUR_API_KEY }}
          SEOUL_RAW: ${{ secrets.SEOUL_API_KEY }}
          S: ${{ secrets.SEOUL_API_KEY }}
        run: |
          set +e
          TOUR=$(printf '%s' "$TOUR_RAW" | tr -d '[:space:]'); SEOUL=$(printf '%s' "$SEOUL_RAW" | tr -d '[:space:]')
          echo "TOUR 원래 길이 ${#TOUR_RAW} → 공백 제거 후 ${#TOUR}"
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          K=$(enc "$TOUR")
          probe() { echo "== $1"; curl -s -m 60 --retry 2 -o /tmp/b -w "HTTP %{http_code} %{time_total}s\n" "$2" || echo "curl 실패 $?"; head -c 700 /tmp/b; echo; }
          curl -s -m 60 -o /tmp/c "https://apis.data.go.kr/B553457/cultureinfo/period2?serviceKey=$K&numOfrows=500&PageNo=1&from=20261016&to=20270215"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, collections
          r=ET.parse('/tmp/c').getroot()
          print('total', r.findtext('.//totalCount'))
          items=r.findall('.//item')
          print('fields', sorted({c.tag for it in items for c in it}))
          for k in ['serviceName','realmName','area']:
              print(k, collections.Counter(it.findtext(k) for it in items).most_common(25))
          print('sample', {c.tag:(c.text or '')[:80] for c in items[0]})
          print('seq', items[0].findtext('seq'))
          open('/tmp/seq','w').write(items[0].findtext('seq'))
          PY
          echo "== detail2"
          curl -s -m 60 "https://apis.data.go.kr/B553457/cultureinfo/detail2?serviceKey=$K&seq=$(cat /tmp/seq)" | head -c 2500; echo
