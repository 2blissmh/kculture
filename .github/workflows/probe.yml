name: API 진단 (임시)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 접속 진단
        env:
          TOUR_RAW: ${{ secrets.TOUR_API_KEY }}
          SEOUL_RAW: ${{ secrets.SEOUL_API_KEY }}
          S: ${{ secrets.SEOUL_API_KEY }}
        run: |
          TOUR=$(printf '%s' "$TOUR_RAW" | tr -d '[:space:]'); SEOUL=$(printf '%s' "$SEOUL_RAW" | tr -d '[:space:]')
          echo "TOUR 원래 길이 ${#TOUR_RAW} → 공백 제거 후 ${#TOUR}"
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          K=$(enc "$TOUR")
          probe() { echo "== $1"; curl -s -m 30 -o /tmp/b -w "HTTP %{http_code} %{time_total}s\n" "$2" || echo "curl 실패 $?"; head -c 700 /tmp/b; echo; }
          probe "Tour festival" "https://apis.data.go.kr/B551011/KorService2/searchFestival2?serviceKey=$K&MobileOS=ETC&MobileApp=KC&_type=json&numOfRows=1&eventStartDate=20261001"
          probe "Tour detailIntro" "https://apis.data.go.kr/B551011/KorService2/detailIntro2?serviceKey=$K&MobileOS=ETC&MobileApp=KC&_type=json&contentId=$(python3 -c "import json;print(json.load(open('/tmp/b'))['response']['body']['items']['item'][0]['contentid'])" 2>/dev/null)&contentTypeId=15"
          probe "한눈에 period2" "https://apis.data.go.kr/B553457/cultureinfo/period2?serviceKey=$K&numOfrows=2&PageNo=1&from=20261016&to=20261031"
          for s in 1 3001 6001 12001; do
            echo "== Seoul $s"
            curl -s -m 120 -o /tmp/s -w "HTTP %{http_code} %{time_total}s %{size_download}B\n" "http://openapi.seoul.go.kr:8088/$SEOUL/json/culturalEventInfo/$s/$((s+999))/" || echo "curl 실패 $?"
            python3 -c "import json;r=json.load(open('/tmp/s'))['culturalEventInfo']['row'];e=[x['END_DATE'][:10] for x in r];print('rows',len(r),'END 최소',min(e),'최대',max(e),'첫행 등록',r[0].get('RGSTDATE'))" 2>&1 | head -2
          done
          echo "== node fetch Seoul 1000"
          node -e "const t=Date.now();fetch('http://openapi.seoul.go.kr:8088/'+process.env.S+'/json/culturalEventInfo/1/1000/').then(r=>r.text()).then(x=>console.log('ok',x.length,(Date.now()-t)+'ms')).catch(e=>console.log('fail',e.cause&&e.cause.code,e.message,(Date.now()-t)+'ms'))"
