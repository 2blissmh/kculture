<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전국 문화생활</title><style>body{margin:0;background:#fff}</style></head>
<body>
<!-- =====================================================================
  전국 문화생활 위젯 (아임웹 "HTML 코드" 위젯에 이 파일 전체를 붙여넣기)
  ▸ 아래 DATA_URL 에 GitHub Pages 주소를 넣으세요.
    예) https://내아이디.github.io/kculture/data/events.json
  ▸ 비워두면 '샘플 데이터'로 동작합니다(미리보기용).
====================================================================== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<div id="kc-app" data-data-url="data/events.json"></div>
<style>
#kc-app{--kc-bg:#fff;--kc-soft:#f6f7f9;--kc-line:#e6e8ec;--kc-text:#16181d;--kc-sub:#5d6470;--kc-mute:#8b919c;--kc-pri:#ff5a3c;--kc-pri-soft:#fff0ec;--kc-dark:#1f2430;--kc-r:14px;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--kc-text);background:var(--kc-bg);max-width:1200px;margin:0 auto;padding:16px;line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased;text-align:left}
#kc-app *,#kc-app *::before,#kc-app *::after{box-sizing:border-box}
#kc-app button,#kc-app input,#kc-app select{font:inherit;color:inherit;margin:0}
#kc-app button{cursor:pointer;background:none;border:0;padding:0}
#kc-app a{color:inherit;text-decoration:none}
#kc-app img{display:block;max-width:100%}
#kc-app h2,#kc-app h3,#kc-app h4,#kc-app p{margin:0;padding:0}
#kc-app .kc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
#kc-app .kc-title{font-size:26px;font-weight:800;letter-spacing:-.03em}
#kc-app .kc-title em{font-style:normal;color:var(--kc-pri)}
#kc-app .kc-updated{font-size:12px;color:var(--kc-mute)}
#kc-app .kc-tabs{display:flex;gap:4px;background:var(--kc-soft);padding:4px;border-radius:999px}
#kc-app .kc-tab{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--kc-sub);white-space:nowrap}
#kc-app .kc-tab[aria-selected="true"]{background:#fff;color:var(--kc-text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
#kc-app .kc-tab b{color:var(--kc-pri);margin-left:2px}
#kc-app .kc-banner{background:#fff8e1;border:1px solid #ffe08a;color:#7a5b00;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
#kc-app .kc-search{display:flex;gap:8px;margin-bottom:10px}
#kc-app .kc-search-box{flex:1;position:relative}
#kc-app .kc-search-box input{width:100%;height:46px;border:1.5px solid var(--kc-line);border-radius:12px;padding:0 14px 0 42px;background:#fff;outline:none}
#kc-app .kc-search-box input:focus{border-color:var(--kc-dark)}
#kc-app .kc-search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--kc-mute)}
#kc-app .kc-filter-btn{height:46px;padding:0 16px;border:1.5px solid var(--kc-line);border-radius:12px;font-weight:600;display:none;align-items:center;gap:6px;background:#fff}
#kc-app .kc-filter-btn i{font-style:normal;background:var(--kc-pri);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
#kc-app .kc-filters{border:1px solid var(--kc-line);border-radius:var(--kc-r);padding:6px 16px;margin-bottom:12px;background:#fff}
#kc-app .kc-frow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--kc-line)}
#kc-app .kc-frow:last-child{border-bottom:0}
#kc-app .kc-flabel{flex:0 0 52px;font-size:13px;font-weight:700;color:var(--kc-sub);padding-top:7px}
#kc-app .kc-fbody{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
#kc-app .kc-chip{height:34px;padding:0 13px;border:1px solid var(--kc-line);border-radius:999px;font-size:13.5px;background:#fff;color:var(--kc-sub);white-space:nowrap;transition:all .12s}
#kc-app .kc-chip:hover{border-color:#c9ccd2}
#kc-app .kc-chip[aria-pressed="true"]{background:var(--kc-dark);border-color:var(--kc-dark);color:#fff;font-weight:600}
#kc-app .kc-chip.kc-free[aria-pressed="true"]{background:#16a34a;border-color:#16a34a}
#kc-app select.kc-sel,#kc-app input.kc-date{height:34px;border:1px solid var(--kc-line);border-radius:10px;padding:0 10px;background:#fff;font-size:13.5px;max-width:100%}
#kc-app .kc-range{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#kc-app .kc-sep{width:1px;height:20px;background:var(--kc-line);margin:0 4px}
#kc-app .kc-hint{font-size:11.5px;color:var(--kc-mute)}
#kc-app .kc-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
#kc-app .kc-count{font-weight:700}
#kc-app .kc-count b{color:var(--kc-pri)}
#kc-app .kc-actives{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#kc-app .kc-active{font-size:12.5px;background:var(--kc-pri-soft);color:#c2331a;border-radius:999px;padding:4px 6px 4px 10px;display:inline-flex;align-items:center;gap:4px}
#kc-app .kc-active button{width:18px;height:18px;border-radius:50%;line-height:18px;font-size:13px;color:#c2331a}
#kc-app .kc-reset{font-size:12.5px;color:var(--kc-sub);text-decoration:underline}
#kc-app .kc-section{margin:22px 0 6px}
#kc-app .kc-section h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
#kc-app .kc-section h3 small{font-size:12.5px;font-weight:500;color:var(--kc-mute)}
#kc-app .kc-rail-wrap{position:relative}
#kc-app .kc-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,22%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
#kc-app .kc-rail>*{scroll-snap-align:start}
#kc-app .kc-nav{position:absolute;top:34%;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:18px;z-index:2}
#kc-app .kc-nav.l{left:-12px}#kc-app .kc-nav.r{right:-12px}
#kc-app .kc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px 14px}
#kc-app .kc-card{position:relative;display:flex;flex-direction:column;cursor:pointer;min-width:0}
#kc-app .kc-thumb{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--kc-soft)}
#kc-app .kc-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
#kc-app .kc-card:hover .kc-thumb img{transform:scale(1.04)}
#kc-app .kc-ph,.kc-modal .kc-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;font-weight:800;font-size:17px;line-height:1.3;letter-spacing:-.02em;word-break:keep-all}
#kc-app .kc-ph span,.kc-modal .kc-ph span{font-size:11px;font-weight:600;opacity:.85;margin-bottom:4px}
#kc-app .kc-badges{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;right:44px}
#kc-app .kc-badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(20,22,28,.78);color:#fff;line-height:1.3}
#kc-app .kc-badge.hot{background:var(--kc-pri)}
#kc-app .kc-badge.free{background:#16a34a}
#kc-app .kc-heart{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#kc-app .kc-heart svg{width:18px;height:18px}
#kc-app .kc-heart[aria-pressed="true"] svg{fill:var(--kc-pri);stroke:var(--kc-pri)}
#kc-app .kc-info{padding:9px 2px 0}
#kc-app .kc-genre{font-size:12px;font-weight:700}
#kc-app .kc-name{font-size:15px;font-weight:700;line-height:1.35;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
#kc-app .kc-meta{font-size:12.5px;color:var(--kc-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kc-app .kc-more{display:block;margin:22px auto 4px;height:46px;padding:0 28px;border:1.5px solid var(--kc-line);border-radius:999px;font-weight:700;background:#fff}
#kc-app .kc-empty{padding:50px 10px;text-align:center;color:var(--kc-sub)}
#kc-app .kc-empty b{display:block;font-size:17px;color:var(--kc-text);margin-bottom:4px}
#kc-app .kc-credit{margin-top:32px;padding-top:12px;border-top:1px solid var(--kc-line);font-size:11.5px;color:var(--kc-mute)}
#kc-app .kc-loading{padding:60px 0;text-align:center;color:var(--kc-mute)}
/* 캘린더 */
#kc-app .kc-cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
#kc-app .kc-cal-head h3{font-size:20px;font-weight:800}
#kc-app .kc-cal-head button{width:36px;height:36px;border:1px solid var(--kc-line);border-radius:10px;font-size:16px}
#kc-app .kc-cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--kc-line);border-left:1px solid var(--kc-line)}
#kc-app .kc-dow{font-size:12px;font-weight:700;text-align:center;padding:6px 0;background:var(--kc-soft);border-right:1px solid var(--kc-line);border-bottom:1px solid var(--kc-line);color:var(--kc-sub)}
#kc-app .kc-day{min-height:92px;padding:5px;border-right:1px solid var(--kc-line);border-bottom:1px solid var(--kc-line);text-align:left;display:flex;flex-direction:column;gap:3px;background:#fff;min-width:0}
#kc-app .kc-day.out{background:#fafbfc;color:#b9bdc5}
#kc-app .kc-day.sel{outline:2px solid var(--kc-dark);outline-offset:-2px;z-index:1}
#kc-app .kc-day .n{font-size:13px;font-weight:700}
#kc-app .kc-day.today .n{background:var(--kc-pri);color:#fff;border-radius:999px;padding:0 7px;align-self:flex-start}
#kc-app .kc-day.sun .n{color:#e5484d}#kc-app .kc-day.sat .n{color:#3b6fe5}
#kc-app .kc-day.today.sun .n,#kc-app .kc-day.today.sat .n{color:#fff}
#kc-app .kc-plan{font-size:11px;background:var(--kc-pri-soft);color:#b42a12;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#kc-app .kc-cnt{font-size:11px;color:var(--kc-mute);margin-top:auto}
#kc-app .kc-daylist{margin-top:16px}
#kc-app .kc-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--kc-line);align-items:center;cursor:pointer}
#kc-app .kc-row .kc-rimg{width:54px;height:72px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:var(--kc-soft);position:relative}
#kc-app .kc-row .kc-rimg img{width:100%;height:100%;object-fit:cover}
#kc-app .kc-row .kc-rbody{flex:1;min-width:0}
#kc-app .kc-row .kc-name{font-size:14.5px;margin:1px 0 2px}
#kc-app .kc-row .kc-x{font-size:12px;color:var(--kc-sub);border:1px solid var(--kc-line);border-radius:8px;padding:4px 8px;flex:0 0 auto}
#kc-app .kc-sub{font-size:16px;font-weight:800;margin:18px 0 4px}
/* 모달 */
.kc-modal{position:fixed;inset:0;z-index:2147483000;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;color:#16181d;line-height:1.5;text-align:left}
.kc-modal *{box-sizing:border-box}
.kc-modal button,.kc-modal input{font:inherit;color:inherit}
.kc-modal button{cursor:pointer;border:0;background:none;padding:0}
.kc-modal a{color:inherit;text-decoration:none}
.kc-dialog{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;position:relative;display:grid;grid-template-columns:260px 1fr;gap:0}
.kc-dialog .kc-dimg{background:#f6f7f9;position:relative;min-height:340px}
.kc-dialog .kc-dimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.kc-dialog .kc-dbody{padding:22px 22px 18px;min-width:0}
.kc-dialog .kc-close{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);font-size:20px;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.kc-dialog h2{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.35;margin:4px 0 12px;word-break:keep-all;padding-right:30px}
.kc-dialog dl{display:grid;grid-template-columns:72px 1fr;gap:7px 10px;font-size:14px;margin:0 0 14px}
.kc-dialog dt{color:#8b919c;font-weight:600}
.kc-dialog dd{margin:0;word-break:break-all}
.kc-dialog .kc-tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#f1f2f4;margin-right:4px}
.kc-dialog .kc-plan-box{background:#f6f7f9;border-radius:12px;padding:12px;margin-bottom:12px}
.kc-dialog .kc-plan-box label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.kc-dialog .kc-plan-box .r{display:flex;gap:6px;flex-wrap:wrap}
.kc-dialog .kc-plan-box input{height:38px;border:1px solid #e6e8ec;border-radius:10px;padding:0 10px;background:#fff;flex:1;min-width:140px}
.kc-dialog .kc-btn{height:38px;padding:0 14px;border-radius:10px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid #e6e8ec;background:#fff;white-space:nowrap}
.kc-dialog .kc-btn.pri{background:#ff5a3c;border-color:#ff5a3c;color:#fff}
.kc-dialog .kc-btn.dark{background:#1f2430;border-color:#1f2430;color:#fff}
.kc-dialog .kc-btn[aria-pressed="true"]{color:#ff5a3c;border-color:#ff5a3c}
.kc-dialog .kc-acts{display:flex;flex-wrap:wrap;gap:6px}
.kc-dialog .kc-src{font-size:11.5px;color:#8b919c;margin-top:12px}
.kc-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:2147483001;font-family:"Pretendard Variable",Pretendard,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:kcfade .2s}
@keyframes kcfade{from{opacity:0;transform:translate(-50%,8px)}}
@media (max-width:768px){
  #kc-app{padding:12px;font-size:14px}
  #kc-app .kc-title{font-size:21px}
  #kc-app .kc-tabs{width:100%}
  #kc-app .kc-tab{flex:1;padding:8px 6px}
  #kc-app .kc-filter-btn{display:inline-flex}
  #kc-app .kc-filters.kc-collapsed{display:none}
  #kc-app .kc-frow{flex-direction:column;gap:6px}
  #kc-app .kc-flabel{padding-top:0;flex:none}
  #kc-app .kc-fbody{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  #kc-app .kc-fbody.wrap{flex-wrap:wrap}
  #kc-app .kc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}
  #kc-app .kc-rail{grid-auto-columns:42%}
  #kc-app .kc-nav{display:none}
  #kc-app .kc-name{font-size:14px}
  #kc-app .kc-day{min-height:64px;padding:3px}
  #kc-app .kc-plan{font-size:10px;padding:0 2px}
  .kc-modal{padding:0;align-items:flex-end}
  .kc-dialog{grid-template-columns:1fr;border-radius:18px 18px 0 0;max-height:92vh}
  .kc-dialog .kc-dimg{min-height:0;height:240px}
}
</style>
<script>
(function () {
  'use strict';
  var root = document.getElementById('kc-app');
  if (!root || root.__kc) return;
  root.__kc = true;

  /* ===================== 설정 ===================== */
  var DATA_URL = root.getAttribute('data-data-url') || '';   // ← 여기에 events.json 주소 (또는 위 div 의 data-data-url)
  var PAGE_SIZE = 24;
  var LS = 'kc_';

  /* ===================== 기준 정보 ===================== */
  var SIDO = ['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
  var GENRES = [
    ['festival','축제','#ff5a3c'],['concert','콘서트','#7c3aed'],['musical','뮤지컬','#db2777'],
    ['theater','연극','#0891b2'],['classic','클래식','#2563eb'],['gugak','국악','#b45309'],
    ['dance','무용','#0d9488'],['exhibit','전시','#4f46e5'],['event','체험·행사','#16a34a'],['etc','기타','#64748b']
  ];
  var G = {}; GENRES.forEach(function (g) { G[g[0]] = { name: g[1], color: g[2] }; });
  var SRC = { tour: '한국관광공사 TourAPI', kopis: 'KOPIS 공연예술통합전산망', culture: '한국문화정보원 문화포털', seoul: '서울 열린데이터광장' };
  var DATES = [['all','전체'],['today','오늘'],['weekend','이번 주말'],['week','이번 주'],['month','이번 달'],['custom','기간 선택']];
  var AGES = [['','전체 연령'],['0','전체관람가'],['5','만 5세 관람 가능'],['8','만 8세 관람 가능'],['13','만 13세 관람 가능']];

  /* ===================== 날짜 유틸 ===================== */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function add(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function diff(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
  var NOW = new Date(); NOW.setHours(0, 0, 0, 0);
  var TODAY = ymd(NOW);
  function weekendRange() {
    var w = NOW.getDay();
    if (w === 6) return [TODAY, ymd(add(NOW, 1))];
    if (w === 0) return [TODAY, TODAY];
    return [ymd(add(NOW, 6 - w)), ymd(add(NOW, 7 - w))];
  }
  function rangeOf(key) {
    if (key === 'today') return [TODAY, TODAY];
    if (key === 'weekend') return weekendRange();
    if (key === 'week') return [TODAY, ymd(add(NOW, NOW.getDay() === 0 ? 0 : 7 - NOW.getDay()))];
    if (key === 'month') return [TODAY, ymd(new Date(NOW.getFullYear(), NOW.getMonth() + 1, 0))];
    if (key === 'custom') return [S.from || TODAY, S.to || S.from || '9999-12-31'];
    return null;
  }
  function fmtDate(s) { var d = parse(s); return (d.getFullYear() !== NOW.getFullYear() ? d.getFullYear() + '.' : '') + (d.getMonth() + 1) + '.' + d.getDate(); }
  function fmtPeriod(e) { return e.sd === e.ed ? fmtDate(e.sd) : fmtDate(e.sd) + ' ~ ' + fmtDate(e.ed); }
  var DOW = ['일','월','화','수','목','금','토'];

  /* ===================== 공통 유틸 ===================== */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
  function load(k, d) { try { var v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0) / 4294967295; }
  function toast(msg) {
    var old = document.querySelector('.kc-toast'); if (old) old.remove();
    var t = document.createElement('div'); t.className = 'kc-toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);

        id: 'demo:' + i, src: 'demo', t: (g === 'festival' ? pl[0].replace(/[시군구]$/, '') + ' ' : '') + t, g: g,
        sd: ymd(sd), ed: ymd(add(sd, len)), sido: sido, sgg: pl[0], pl: pl[1],
        free: free, fee: free ? '무료' : pick(['전석 30,000원', 'R석 70,000원 / S석 50,000원', '일반 15,000원']),
        age: am === 0 ? '전체관람가' : '만 ' + am + '세 이상', am: am,
        io: /공원|일원|해수욕장|광장|마을|한옥|시공원/.test(pl[1]) ? 'out' : 'in', url: ''
      });
    }
    return out;
  }

  start();
})();
